name: 'Sync MDX from Google Drive'
description: 'Download MD files from Google Drive and convert to MDX format'

inputs:
  rclone-config:
    description: 'Base64 encoded rclone config'
    required: true
  service-account-file:
    description: 'Base64 encoded service account JSON'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        rclone_config: ${{ inputs.rclone-config }}
    
    - name: Add Rclone service account file
      uses: AnimMouse/setup-rclone/service-account-file@v1
      with:
        service_account_filename: service-account-file.json
        service_account_file: ${{ inputs.service-account-file }}
    
    - name: Download from Google Drive
      shell: bash
      run: |
        mkdir -p ./temp_download
        rclone sync remote: ./temp_download
    
    - name: Convert md to html.mdx and move to app/routes
      shell: bash
      run: |
        find ./temp_download -name "*.md" -type f | while read -r file; do
          # temp_download/ を削除してrelativeパスを取得
          relative_path="${file#./temp_download/}"
          
          # 拡張子を .md → .html.mdx に変更
          new_path="${relative_path%.md}.html.mdx"
          
          # app/routes配下に配置
          target_path="app/routes/$new_path"
          
          # ディレクトリを作成
          mkdir -p "$(dirname "$target_path")"
          
          # ファイルをコピー
          cp "$file" "$target_path"
          
          echo "Restored: $relative_path → $target_path"
        done
    
    - name: Verify restored files
      shell: bash
      run: |
        echo "Total MDX files restored:"
        find app/routes -name "*.mdx" -type f | wc -l
        echo ""
        echo "All restored files:"
        find app/routes -name "*.mdx" -type f | sort
