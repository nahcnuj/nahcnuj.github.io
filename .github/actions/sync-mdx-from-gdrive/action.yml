name: 'Sync MDX from Google Drive'
description: 'Download MD files from Google Drive and convert to MDX format'

inputs:
  rclone-config:
    description: 'Base64 encoded rclone config'
    required: true
  service-account-file:
    description: 'Base64 encoded service account JSON'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        rclone_config: ${{ inputs.rclone-config }}
    
    - name: Add Rclone service account file
      uses: AnimMouse/setup-rclone/service-account-file@v1
      with:
        service_account_filename: service-account-file.json
        service_account_file: ${{ inputs.service-account-file }}
    
    - name: Download from Google Drive
      shell: bash
      run: |
        mkdir -p ./temp_download
        rclone sync remote: ./temp_download
    
    - name: Convert md to html.mdx and move to app/routes
      shell: bash
      run: |
        # Create a Perl script to process files
        cat > /tmp/process_mdx.pl << 'PERLEOF'
        use strict;
        use warnings;
        
        my $file = $ARGV[0];
        my $target = $ARGV[1];
        
        open(my $fh, '<', $file) or die "Cannot open $file: $!";
        my $content = do { local $/; <$fh> };
        close($fh);
        
        # 1. <blockquote> タグを複数行に整形
        $content =~ s/(<blockquote[^>]*>)([^\n])/$1\n$2/g;
        $content =~ s/([^\n])(<\/blockquote>)/$1\n$2/g;
        
        # 2. aligned → align* に変換
        $content =~ s/\\begin\{aligned\}/\\begin{align*}/g;
        $content =~ s/\\end\{aligned\}/\\end{align*}/g;
        
        # 3. Remove & markers only within align* environments
        while ($content =~ /\\begin\{align\*\}(.*?)\\end\{align\*\}/s) {
          my $math_content = $1;
          my $original = $&;
          $math_content =~ s/&\s*//g;
          $content =~ s/\Q$original\E/\\begin{align*}$math_content\\end{align*}/;
        }
        
        # Write to target
        open($fh, '>', $target) or die "Cannot write $target: $!";
        print $fh $content;
        close($fh);
        
        print "✓ Processed: $target\n";
        PERLEOF
        
        # Exclude top-level underscore-prefixed directories during find
        find ./temp_download -path './temp_download/_*' -prune -o -name '*.md' -type f -print | while read -r file; do
          relative_path="${file#./temp_download/}"
          
          # 拡張子を .md → .html.mdx に変更
          new_path="${relative_path%.md}.html.mdx"
          
          # app/routes配下に配置
          target_path="app/routes/$new_path"
          
          # ディレクトリを作成
          mkdir -p "$(dirname "$target_path")"
          
          # Perlスクリプトで処理
          perl /tmp/process_mdx.pl "$file" "$target_path"
        done
    
    - name: Copy images directories to public
      shell: bash
      run: |
        copied_dirs=()
        # Exclude top-level underscore-prefixed directories during find
        while IFS= read -r dir; do
          relative_path="${dir#./temp_download/}"
          
          # publicディレクトリ配下に配置
          target_parent="public/$(dirname "$relative_path")"
          
          # 親ディレクトリを作成
          mkdir -p "$target_parent/images"
          
          # ディレクトリを同期コピー (削除も反映)
          rsync -a --delete "$dir"/ "$target_parent/images/"
          
          echo "Copied: $relative_path → $target_parent/images"
          copied_dirs+=("$target_parent/images")
        done < <(find ./temp_download -path './temp_download/_*' -prune -o -type d -name 'images' -print)
        
        echo ""
        echo "Total images directories copied: ${#copied_dirs[@]}"
        echo ""
        echo "All images directories:"
        printf '%s\n' "${copied_dirs[@]}" | sort
    
    - name: Verify restored files
      shell: bash
      run: |
        echo "Total MDX files restored:"
        find app/routes -name "*.mdx" -type f | wc -l
        echo ""
        echo "All restored files:"
        find app/routes -name "*.mdx" -type f | sort
