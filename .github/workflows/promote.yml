name: Promote to gh-pages

on:
  workflow_run:
    # CI and Update run in parallel on push to main.
    # Promote starts immediately when Update finishes (Drive content already on gh-pages).
    workflows: ["Update"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  promote:
    # Only promote when Update on main succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      # Assume main should be green: wait until CI for this SHA has completed successfully
      # before merging (CI runs in parallel with Update; Update often finishes first).
      - name: Wait for CI to be green (parallel with Update; required before promote)
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Update already succeeded. Waiting for CI on SHA $SHA to be green..."
          for i in {1..90}; do
            RUN_JSON=$(gh run list --workflow "CI" --branch main --json headSha,status,conclusion \
              --jq --compact-output "[.[] | select(.headSha == \"$SHA\")] | first // empty")
            if [ -n "$RUN_JSON" ]; then
              STATUS=$(echo "$RUN_JSON" | jq -r '.status')
              CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion // empty')
              echo "CI run status: $STATUS conclusion: ${CONCLUSION:-none} (attempt $i)"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI is green for this commit."
                  exit 0
                else
                  echo "CI completed with $CONCLUSION — not promoting."
                  exit 1
                fi
              fi
            else
              echo "No CI run found yet for $SHA (attempt $i)"
            fi
            sleep 10
          done
          echo "Timed out waiting for CI"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Merge main into gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=20

          git checkout gh-pages

          # Perform the merge from main (this is the dedicated step for main -> gh-pages)
          # --no-ff keeps history clean for future local merges from main
          git merge origin/main --no-ff --no-edit || {
            git checkout --theirs .
            git add -A
            git commit -m "Merge main (auto-resolved)" || true
          }

          if git diff --quiet HEAD "origin/gh-pages"; then
            echo "No changes from merge."
          else
            git push origin gh-pages
            # Push to gh-pages by GITHUB_TOKEN does not trigger 'on: push' workflows.
            # We explicitly dispatch Deploy (defaults to main ref for workflow code)
            # which checks out gh-pages content for the actual site.
          fi
          # Promote is triggered by Update success, then waits for CI green.
          # So Drive content (Update) is already on gh-pages before the code merge.
          # Deploy is dispatched only after this merge.

      - name: Dispatch Deploy workflow
        if: github.event_name != 'pull_request'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
