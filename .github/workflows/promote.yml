name: Promote to gh-pages

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  promote:
    # Only promote when CI on main succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Wait for Update workflow to complete (to ensure Drive content is on gh-pages)
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Waiting for Update workflow on SHA $SHA to complete (promote after Update)..."
          for i in {1..60}; do
            RUN_JSON=$(gh run list --workflow "Update" --branch main --json headSha,status,conclusion --jq '.[] | select(.headSha == "'$SHA'")')
            if [ -n "$RUN_JSON" ]; then
              STATUS=$(echo "$RUN_JSON" | jq -r '.status')
              CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion // empty')
              echo "Update run status: $STATUS conclusion: ${CONCLUSION:-none}"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ] || [ -z "$CONCLUSION" ]; then
                  echo "Update completed successfully for this commit."
                  break
                else
                  echo "Update completed with failure: $CONCLUSION"
                  exit 1
                fi
              fi
            else
              echo "No Update run found yet for $SHA (attempt $i)"
            fi
            sleep 10
          done
          if [ "$i" -ge 60 ]; then
            echo "Timed out waiting for Update workflow"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Merge main into gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=20

          git checkout gh-pages

          # Perform the merge from main (this is the dedicated step for main -> gh-pages)
          # --no-ff keeps history clean for future local merges from main
          git merge origin/main --no-ff --no-edit || {
            git checkout --theirs .
            git add -A
            git commit -m "Merge main (auto-resolved)" || true
          }

          if git diff --quiet HEAD "origin/gh-pages"; then
            echo "No changes from merge."
          else
            git push origin gh-pages
            # Push to gh-pages by GITHUB_TOKEN does not trigger 'on: push' workflows.
            # We explicitly dispatch Deploy (defaults to main ref for workflow code)
            # which checks out gh-pages content for the actual site.
          fi
          # NOTE: We explicitly wait for the Update workflow (Drive content sync) to complete before merging.
          # This ensures gh-pages has the latest content from Update before we promote the code merge from main.
          # Deploy is dispatched only after this.

      - name: Dispatch Deploy workflow
        if: github.event_name != 'pull_request'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
