name: Promote to gh-pages

on:
  push:
    branches:
      - main
  # CI and Update also run on push to main (parallel).
  # Promote merges main → gh-pages immediately (can run before Update).
  # Assume main is always green — no wait for CI or Update.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge main into gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=20

          git checkout gh-pages

          # Perform the merge from main (this is the dedicated step for main -> gh-pages)
          # --no-ff keeps history clean for future local merges from main
          git merge origin/main --no-ff --no-edit || {
            git checkout --theirs .
            git add -A
            git commit -m "Merge main (auto-resolved)" || true
          }

          if git diff --quiet HEAD "origin/gh-pages"; then
            echo "No changes from merge."
          else
            git push origin gh-pages
            # Push to gh-pages by GITHUB_TOKEN does not trigger 'on: push' workflows.
            # We explicitly dispatch Deploy (defaults to main ref for workflow code)
            # which checks out gh-pages content for the actual site.
          fi
          # CI || Update || Promote run in parallel on push to main.
          # Merge may finish before Update's Drive content push; that is OK.
          # Deploy is dispatched after this merge.

      - name: Dispatch Deploy workflow
        if: github.event_name != 'pull_request'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
