name: CI

on:
  pull_request:
    branches:
      - source

jobs:
  setup:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci --omit dev --ignore-scripts --prefer-offline
      - name: Build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          path: dist
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  test:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Test
        run: npm test
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  e2e:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: website-build-dist
          path: dist
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: E2E Test
        run: npm run test:e2e
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-linux
          path: test-results/
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  vrt:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: website-build-dist
          path: dist
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Check and generate Linux baselines if missing
        run: |
          MISSING_BASELINES=$(find tests/e2e/**/*.vrt.test.ts-snapshots -name '*-chromium-linux.png' 2>/dev/null | wc -l)
          if [ "$MISSING_BASELINES" -eq 0 ]; then
            echo "Linux baselines not found, generating..."
            npm run test:vrt -- --update-snapshots || true
            echo "Baselines generated"
          fi
      - name: VRT Test
        run: npm run test:vrt
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-test-results-linux
          path: test-results/
          retention-days: 7
      - name: Upload generated baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-baselines-linux
          path: tests/e2e/**/*.vrt.test.ts-snapshots/
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Check
        run: npm run lint
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  textlint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Check
        run: npm run lint:text
        continue-on-error: true
