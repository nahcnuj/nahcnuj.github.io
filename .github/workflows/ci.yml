name: CI

on:
  pull_request:
    branches:
      - source

jobs:
  setup:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci --omit dev --ignore-scripts --prefer-offline
      - name: Build
        run: npm run build
      - name: Verify client script on pages without islands
        run: grep -E 'src="/static/client-[^"]+\\.js"' dist/essays/download-link.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  test:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Test
        run: npm test
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  e2e:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: website-build-dist
          path: dist
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: E2E Test
        run: npm run test:e2e
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-linux
          path: test-results/
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  vrt:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: website-build-dist
          path: dist
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Install Japanese fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install Japanese fonts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fonts = @(
            @{ Url = 'https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf'; Name = 'NotoSansCJKjp-Regular.otf' },
            @{ Url = 'https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Bold.otf'; Name = 'NotoSansCJKjp-Bold.otf' }
          )
          $fontFolder = "$env:RUNNER_TEMP\noto-fonts"
          New-Item -ItemType Directory -Force -Path $fontFolder | Out-Null
          $fontsFolder = (New-Object -ComObject Shell.Application).Namespace(0x14)
          foreach ($font in $fonts) {
            $path = Join-Path $fontFolder $font.Name
            Invoke-WebRequest -Uri $font.Url -OutFile $path
            $fontsFolder.CopyHere($path, 0x10)
          }
          Start-Sleep -Seconds 10
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: VRT Test
        run: npm run test:vrt
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Check
        run: npm run lint
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  textlint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Check
        run: npm run lint:text
        continue-on-error: true
