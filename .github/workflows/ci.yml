name: CI

on:
  pull_request:
    branches:
      - source

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci --omit dev --ignore-scripts --prefer-offline
      - name: Build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-build-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  test:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Test
        run: npm test
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  e2e:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: website-build-dist
          path: dist
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E Test
        run: npm run test:e2e
      - name: Generate Linux VRT baselines if needed
        if: failure()
        run: npm run test:vrt -- --update-snapshots || true
      - name: Commit VRT baselines if changed
        if: failure()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if git diff --quiet tests/e2e/math-rendering.vrt.test.ts-snapshots/; then
            echo "No baseline changes"
          else
            git add tests/e2e/math-rendering.vrt.test.ts-snapshots/
            git commit -m "ci: update VRT baselines for Linux environment"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  lint:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Check
        run: npm run lint
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  textlint:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Check
        run: npm run lint:text
        continue-on-error: true
