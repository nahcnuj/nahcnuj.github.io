name: CI

on:
  push:
    branches:
      - source
  pull_request:
    branches:
      - source

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync MDX files from Google Drive
        uses: ./.github/actions/sync-mdx-from-gdrive
        with:
          rclone-config: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          service-account-file: ${{ secrets.SERVICE_ACCOUNT_KEY_JSON_BASE64 }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: |
            .
            !.git

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Build
        run: npm run build
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  lint:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Check
        run: npm run lint
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
