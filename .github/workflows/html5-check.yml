name: HTML5 validate

on:
  workflow_run:
    workflows: ["Deploy"]
    types:
      - completed

jobs:
  check:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: website-build-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Download the artifact produced by the Deploy run (triggered only by push to gh-pages).

      - uses: Cyb3r-Jak3/html5validator-action@4ea5e57383ed7e14432ebbaae1b64893b7c5210b
        with:
          root: dist
          css: false
          format: json
          skip_git_check: true
          blacklist: nuxt-multibyte-url-demo nuxt-multibyte-url-fixed

      - if: failure()
        name: Notify failure to Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: Failed workflow
          SLACK_COLOR: danger
          MSG_MINIMAL: actions url

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log.json
          path: log.log
