name: HTML5 validate

on:
  workflow_run:
    workflows: ["Deploy"]
    types:
      - completed
    # Note: do not filter on branches here; the head_branch of a Deploy run started
    # via workflow_run from Update/Promote is often "main", not "gh-pages". The job
    # guard below is sufficient.

jobs:
  check:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: website-build-dist
          path: dist
          # When the Deploy workflow was itself started via workflow_run (the normal
          # path from Update/Promote), we must explicitly pull the artifact from the
          # originating run. For direct pushes to gh-pages the artifact is in the
          # current run.
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
          github-token: ${{ github.event_name == 'workflow_run' && secrets.GITHUB_TOKEN || '' }}

      - uses: Cyb3r-Jak3/html5validator-action@4ea5e57383ed7e14432ebbaae1b64893b7c5210b
        with:
          root: dist
          css: false
          format: json
          skip_git_check: true
          blacklist: nuxt-multibyte-url-demo nuxt-multibyte-url-fixed

      - if: failure()
        name: Notify failure to Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: Failed workflow
          SLACK_COLOR: danger
          MSG_MINIMAL: actions url

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log.json
          path: log.log
