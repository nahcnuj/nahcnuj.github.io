name: Prepare

on:
  workflow_call:
    secrets:
      RCLONE_CONFIG_BASE64:
        required: true
      SERVICE_ACCOUNT_KEY_JSON_BASE64:
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync MDX files from Google Drive
        uses: ./.github/actions/sync-mdx-from-gdrive
        with:
          rclone-config: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          service-account-file: ${{ secrets.SERVICE_ACCOUNT_KEY_JSON_BASE64 }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Auto-update usemath frontmatter
        run: npm run update:usemath
      - name: Commit and push usemath changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet HEAD; then
            echo "No changes to commit"
          else
            git add app/routes/**/*.mdx
            git commit -m "chore: auto-update usemath frontmatter"
            git push origin "${{ github.head_ref }}"
          fi
      - name: Upload workspace
        uses: actions/upload-artifact@v7
        with:
          name: workspace
          path: |
            app/routes/**/*.mdx
            public/**/images/**
