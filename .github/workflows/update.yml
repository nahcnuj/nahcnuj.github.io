name: Update

on:
  push:
    branches:
      - main
  # Manual trigger (workflow_dispatch) is provided here for rclone/Drive content updates.
  # CI, Update, and Promote all run in parallel on push to main.
  # Promote may merge main→gh-pages before this content push; that is OK.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  setup:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  commit-rclone-to-gh-pages:
    # This workflow's responsibility: run rclone (via prepare) to import Google Drive
    # markdown/images, place them under app/routes and public, and commit to gh-pages.
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download workspace (files placed by rclone sync under app/routes and public)
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-workdir
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Commit rclone-imported sources to gh-pages
        run: |
          cd gh-pages-workdir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=20

          # Overlay only what the rclone sync (prepare) placed:
          # app/routes/**/*.mdx and public images from Google Drive.
          # Code merges from main are handled by the promote workflow.
          rsync -a --delete ../app/routes/ ./app/routes/
          rsync -a --delete ../public/ ./public/

          # Force-add the content files. They are intentionally gitignored on main
          # (to avoid committing dev fixture copies), but we explicitly want them
          # on gh-pages so the build there has the Drive-sourced MDX.
          git add -f app/routes/**/*.mdx 'public/**/images/**'

          if git diff --cached --quiet; then
            echo "No rclone content changes to commit."
          else
            git commit -m "chore: rclone sync from Google Drive (app/routes + public)"
            git push origin gh-pages
            # Content update pushed to gh-pages. No Deploy dispatch here —
            # Promote merges main and dispatches Deploy (may run before or after us).
          fi
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
