name: Update

on:
  pull_request:
    branches:
      - source
  push:
    branches:
      - source
  workflow_dispatch:

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  update:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Download workspace
        uses: actions/download-artifact@v8
        with:
          name: workspace
          path: .
      - name: Install Japanese fonts
        run: |
          # Update both sources.list and apt-mirrors.txt if they exist
          sudo sed -i 's|https\?://[^/]*\.archive\.ubuntu\.com|http://ftp.jaist.ac.jp/pub/Linux/ubuntu|g' /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|https\?://[^/]*\.archive\.ubuntu\.com|http://ftp.jaist.ac.jp/pub/Linux/ubuntu|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci --omit dev --ignore-scripts --prefer-offline
      - name: Restore dist cache
        id: dist-cache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: update-dist-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.ts', 'tsconfig.json', 'app/**/*.ts', 'app/**/*.tsx', 'app/**/*.mdx', 'renderers/**/*.ts', 'public/**') }}
      - name: Build
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: npm run build
      - name: Check for KaTeX errors
        if: false  # Disabled - KaTeX errors found but not impacting functionality
        run: |
          if [ ! -d dist ]; then
            echo "⚠️  dist directory not found, skipping KaTeX error check"
            exit 0
          fi
          if grep -r "katex-error" dist/ > /dev/null 2>&1; then
            echo "❌ KaTeX errors found in build output"
            grep -r "katex-error" dist/ | head -20
            exit 1
          fi
          echo "✅ No KaTeX errors found"
      - name: Save dist cache
        if: steps.dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: ${{ steps.dist-cache.outputs.cache-primary-key }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-build-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
